
name: Build ZYSFX Android APK

on:
  workflow_dispatch:
  push:
    paths:
      - ".github/workflows/build.yml"
      - "app-icon.png"

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Java
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"

      - name: Setup Android SDK
        uses: android-actions/setup-android@v4

      - name: Install Android SDK packages
        run: |
          sdkmanager "platforms;android-35" "build-tools;35.0.0"
          python3 -m pip install pillow

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.9"

      - name: Generate Android project
        shell: bash
        run: |
          set -e

          if [ ! -f app-icon.png ]; then
            echo "ERROR: 仓库根目录缺少 app-icon.png"
            exit 1
          fi

          mkdir -p app/src/main/java/com/zysfx/app
          mkdir -p app/src/main/res

          python3 - <<'PY'
          from PIL import Image
          from pathlib import Path

          src = Image.open("app-icon.png").convert("RGBA")
          res = Path("app/src/main/res")

          def make_icon(size, background=(17, 17, 20, 255)):
              canvas = Image.new("RGBA", (size, size), background)
              icon = src.copy()
              icon.thumbnail(
                  (int(size * 0.82), int(size * 0.82)),
                  Image.Resampling.LANCZOS
              )
              x = (size - icon.width) // 2
              y = (size - icon.height) // 2
              canvas.alpha_composite(icon, (x, y))
              return canvas

          sizes = {
              "mipmap-mdpi": 48,
              "mipmap-hdpi": 72,
              "mipmap-xhdpi": 96,
              "mipmap-xxhdpi": 144,
              "mipmap-xxxhdpi": 192,
          }

          for folder, size in sizes.items():
              path = res / folder
              path.mkdir(parents=True, exist_ok=True)
              make_icon(size).save(path / "ic_launcher.png")
              make_icon(size).save(path / "ic_launcher_round.png")

          drawable = res / "drawable"
          drawable.mkdir(parents=True, exist_ok=True)

          foreground = Image.new("RGBA", (432, 432), (0, 0, 0, 0))
          icon = src.copy()
          icon.thumbnail((280, 280), Image.Resampling.LANCZOS)
          foreground.alpha_composite(
              icon,
              ((432 - icon.width) // 2, (432 - icon.height) // 2)
          )
          foreground.save(drawable / "ic_launcher_foreground.png")

          values = res / "values"
          values.mkdir(parents=True, exist_ok=True)
          (values / "colors.xml").write_text(
              '<?xml version="1.0" encoding="utf-8"?>\n'
              '<resources>\n'
              '    <color name="ic_launcher_background">#111114</color>\n'
              '</resources>\n',
              encoding="utf-8"
          )

          adaptive = res / "mipmap-anydpi-v26"
          adaptive.mkdir(parents=True, exist_ok=True)

          xml = (
              '<?xml version="1.0" encoding="utf-8"?>\n'
              '<adaptive-icon xmlns:android="http://schemas.android.com/apk/res/android">\n'
              '    <background android:drawable="@color/ic_launcher_background"/>\n'
              '    <foreground android:drawable="@drawable/ic_launcher_foreground"/>\n'
              '</adaptive-icon>\n'
          )

          (adaptive / "ic_launcher.xml").write_text(xml, encoding="utf-8")
          (adaptive / "ic_launcher_round.xml").write_text(xml, encoding="utf-8")

          print("App 图标资源生成成功")
          PY

          cat > settings.gradle <<'EOF'
          pluginManagement {
              repositories {
                  google()
                  mavenCentral()
                  gradlePluginPortal()
              }
          }

          dependencyResolutionManagement {
              repositoriesMode.set(RepositoriesMode.FAIL_ON_PROJECT_REPOS)
              repositories {
                  google()
                  mavenCentral()
              }
          }

          rootProject.name = "ZYSFX"
          include(":app")
          EOF

          cat > build.gradle <<'EOF'
          plugins {
              id 'com.android.application' version '8.7.3' apply false
          }
          EOF

          cat > app/build.gradle <<'EOF'
          plugins {
              id 'com.android.application'
          }

          android {
              namespace 'com.zysfx.app'
              compileSdk 35

              defaultConfig {
                  applicationId 'com.zysfx.app'
                  minSdk 23
                  targetSdk 35
                  versionCode 7
                  versionName '1.5.1'
              }

              buildTypes {
                  debug {
                      minifyEnabled false
                  }
              }
          }

          dependencies {
              implementation 'androidx.swiperefreshlayout:swiperefreshlayout:1.1.0'
          }
          EOF

          cat > app/src/main/AndroidManifest.xml <<'EOF'
          <manifest xmlns:android="http://schemas.android.com/apk/res/android">

              <uses-permission android:name="android.permission.INTERNET"/>

              <application
                  android:label="资源社"
                  android:icon="@mipmap/ic_launcher"
                  android:roundIcon="@mipmap/ic_launcher_round"
                  android:theme="@android:style/Theme.Material.Light.NoActionBar"
                  android:usesCleartextTraffic="false">

                  <activity
                      android:name=".MainActivity"
                      android:exported="true"
                      android:configChanges="orientation|screenSize|keyboardHidden">

                      <intent-filter>
                          <action android:name="android.intent.action.MAIN"/>
                          <category android:name="android.intent.category.LAUNCHER"/>
                      </intent-filter>

                  </activity>
              </application>
          </manifest>
          EOF

          cat > app/src/main/java/com/zysfx/app/MainActivity.java <<'EOF'
          package com.zysfx.app;

          import android.app.Activity;
          import android.content.pm.ActivityInfo;
          import android.graphics.Color;
          import android.os.Bundle;
          import android.view.View;
          import android.view.ViewGroup;
          import android.view.WindowManager;
          import android.webkit.JavascriptInterface;
          import android.webkit.WebChromeClient;
          import android.webkit.WebSettings;
          import android.webkit.WebView;
          import android.webkit.WebViewClient;
          import android.widget.FrameLayout;

          import androidx.swiperefreshlayout.widget.SwipeRefreshLayout;

          public class MainActivity extends Activity {

              private WebView webView;
              private SwipeRefreshLayout swipeRefreshLayout;

              private View customView;
              private FrameLayout fullscreenContainer;
              private WebChromeClient.CustomViewCallback fullscreenCallback;

              private int oldSystemUiVisibility;
              private int oldRequestedOrientation =
                      ActivityInfo.SCREEN_ORIENTATION_UNSPECIFIED;

              private boolean orientationChanged = false;
              private volatile boolean lastMediaLandscape = false;

              private void enterOrientation(int orientation) {
                  if (!orientationChanged) {
                      oldRequestedOrientation = getRequestedOrientation();
                      orientationChanged = true;
                  }

                  setRequestedOrientation(orientation);
              }

              private void restoreOrientation() {
                  if (orientationChanged) {
                      setRequestedOrientation(oldRequestedOrientation);
                      orientationChanged = false;
                  }
              }

              private class OrientationBridge {

                  @JavascriptInterface
                  public void setContentOrientation(final int mode) {
                      runOnUiThread(() -> {
                          if (customView != null) return;

                          if (mode == 1) {
                              enterOrientation(
                                  ActivityInfo.SCREEN_ORIENTATION_SENSOR_LANDSCAPE
                              );
                          } else if (mode == 0) {
                              enterOrientation(
                                  ActivityInfo.SCREEN_ORIENTATION_PORTRAIT
                              );
                          }
                      });
                  }

                  @JavascriptInterface
                  public void restoreContentOrientation() {
                      runOnUiThread(() -> {
                          if (customView == null) {
                              restoreOrientation();
                          }
                      });
                  }

                  @JavascriptInterface
                  public void setMediaDimensions(int width, int height) {
                      if (width > 0 && height > 0) {
                          lastMediaLandscape = width > height;
                      } else {
                          lastMediaLandscape = false;
                      }
                  }
              }

              @Override
              protected void onCreate(Bundle state) {
                  super.onCreate(state);

                  swipeRefreshLayout = new SwipeRefreshLayout(this);
                  swipeRefreshLayout.setColorSchemeColors(
                      Color.rgb(220, 30, 80)
                  );

                  webView = new WebView(this);
                  webView.setLayoutParams(
                      new ViewGroup.LayoutParams(
                          ViewGroup.LayoutParams.MATCH_PARENT,
                          ViewGroup.LayoutParams.MATCH_PARENT
                      )
                  );

                  WebSettings settings = webView.getSettings();
                  settings.setJavaScriptEnabled(true);
                  settings.setDomStorageEnabled(true);
                  settings.setMediaPlaybackRequiresUserGesture(false);
                  settings.setLoadWithOverviewMode(true);
                  settings.setUseWideViewPort(true);

                  webView.addJavascriptInterface(
                      new OrientationBridge(),
                      "ZysfxOrientation"
                  );

                  swipeRefreshLayout.setOnRefreshListener(() -> {
                      if (webView != null) {
                          webView.reload();
                      } else {
                          swipeRefreshLayout.setRefreshing(false);
                      }
                  });

                  swipeRefreshLayout.setOnChildScrollUpCallback(
                      (parent, child) ->
                          webView != null && webView.getScrollY() > 0
                  );

                  webView.setWebViewClient(new WebViewClient() {

                      @Override
                      public void onPageFinished(WebView view, String url) {
                          super.onPageFinished(view, url);

                          if (swipeRefreshLayout != null) {
                              swipeRefreshLayout.setRefreshing(false);
                          }

                          injectOrientationDetector(view);
                      }

                      @Override
                      public void onReceivedError(
                              WebView view,
                              android.webkit.WebResourceRequest request,
                              android.webkit.WebResourceError error) {
                          super.onReceivedError(view, request, error);

                          if (request.isForMainFrame()
                                  && swipeRefreshLayout != null) {
                              swipeRefreshLayout.setRefreshing(false);
                          }
                      }
                  });

                  webView.setWebChromeClient(new WebChromeClient() {

                      @Override
                      public void onShowCustomView(
                              View view,
                              CustomViewCallback callback) {

                          if (customView != null) {
                              callback.onCustomViewHidden();
                              return;
                          }

                          customView = view;
                          fullscreenCallback = callback;

                          if (!orientationChanged) {
                              oldRequestedOrientation =
                                  getRequestedOrientation();
                              orientationChanged = true;
                          }

                          View decor = getWindow().getDecorView();
                          oldSystemUiVisibility =
                              decor.getSystemUiVisibility();

                          fullscreenContainer =
                              new FrameLayout(MainActivity.this);
                          fullscreenContainer.setBackgroundColor(Color.BLACK);

                          fullscreenContainer.addView(
                              view,
                              new FrameLayout.LayoutParams(
                                  ViewGroup.LayoutParams.MATCH_PARENT,
                                  ViewGroup.LayoutParams.MATCH_PARENT
                              )
                          );

                          ((ViewGroup) decor).addView(
                              fullscreenContainer,
                              new ViewGroup.LayoutParams(
                                  ViewGroup.LayoutParams.MATCH_PARENT,
                                  ViewGroup.LayoutParams.MATCH_PARENT
                              )
                          );

                          getWindow().addFlags(
                              WindowManager.LayoutParams.FLAG_KEEP_SCREEN_ON
                          );

                          setRequestedOrientation(
                              lastMediaLandscape
                                  ? ActivityInfo.SCREEN_ORIENTATION_SENSOR_LANDSCAPE
                                  : ActivityInfo.SCREEN_ORIENTATION_PORTRAIT
                          );

                          decor.setSystemUiVisibility(
                              View.SYSTEM_UI_FLAG_FULLSCREEN
                              | View.SYSTEM_UI_FLAG_HIDE_NAVIGATION
                              | View.SYSTEM_UI_FLAG_IMMERSIVE_STICKY
                              | View.SYSTEM_UI_FLAG_LAYOUT_FULLSCREEN
                              | View.SYSTEM_UI_FLAG_LAYOUT_HIDE_NAVIGATION
                              | View.SYSTEM_UI_FLAG_LAYOUT_STABLE
                          );
                      }

                      @Override
                      public void onHideCustomView() {
                          hideFullscreen();
                      }
                  });

                  swipeRefreshLayout.addView(
                      webView,
                      new SwipeRefreshLayout.LayoutParams(
                          ViewGroup.LayoutParams.MATCH_PARENT,
                          ViewGroup.LayoutParams.MATCH_PARENT
                      )
                  );

                  setContentView(swipeRefreshLayout);

                  if (state == null) {
                      webView.loadUrl("https://www.zysfx.com/");
                  } else {
                      webView.restoreState(state);
                  }
              }

              private void injectOrientationDetector(WebView view) {
                  String js =
                      "(function(){"
                    + "if(window.__zysfxOrientationInstalled)return;"
                    + "window.__zysfxOrientationInstalled=true;"
                    + "function visible(e){"
                    + "if(!e)return false;"
                    + "var r=e.getBoundingClientRect(),s=getComputedStyle(e);"
                    + "return r.width>0&&r.height>0&&s.display!=='none'&&s.visibility!=='hidden';"
                    + "}"
                    + "function detect(){"
                    + "var root=document.fullscreenElement||document.webkitFullscreenElement;"
                    + "var v=root&&root.querySelector('video');"
                    + "if(!v){"
                    + "var videos=document.querySelectorAll('video');"
                    + "var area=0;"
                    + "for(var i=0;i<videos.length;i++){"
                    + "if(!visible(videos[i]))continue;"
                    + "var r=videos[i].getBoundingClientRect();"
                    + "if(r.width*r.height>area){area=r.width*r.height;v=videos[i];}"
                    + "}"
                    + "}"
                    + "if(v&&visible(v)&&v.videoWidth>0&&v.videoHeight>0){"
                    + "ZysfxOrientation.setMediaDimensions(v.videoWidth,v.videoHeight);"
                    + "if(root){"
                    + "ZysfxOrientation.setContentOrientation(v.videoWidth>v.videoHeight?1:0);"
                    + "}return;"
                    + "}"
                    + "var img=root&&root.querySelector('img');"
                    + "if(img){"
                    + "ZysfxOrientation.setMediaDimensions(0,0);"
                    + "ZysfxOrientation.setContentOrientation(0);"
                    + "return;"
                    + "}"
                    + "if(!root){ZysfxOrientation.restoreContentOrientation();}"
                    + "}"
                    + "document.addEventListener('fullscreenchange',function(){setTimeout(detect,100);});"
                    + "document.addEventListener('webkitfullscreenchange',function(){setTimeout(detect,100);});"
                    + "document.addEventListener('loadedmetadata',function(e){"
                    + "var v=e.target;"
                    + "if(v&&v.tagName==='VIDEO'&&v.videoWidth&&v.videoHeight){"
                    + "ZysfxOrientation.setMediaDimensions(v.videoWidth,v.videoHeight);"
                    + "}"
                    + "},true);"
                    + "document.addEventListener('click',function(){"
                    + "setTimeout(detect,300);setTimeout(detect,800);"
                    + "},true);"
                    + "new MutationObserver(function(){setTimeout(detect,250);})"
                    + ".observe(document.documentElement,{childList:true,subtree:true,attributes:true,attributeFilter:['class','style']});"
                    + "})();";

                  view.evaluateJavascript(js, null);
              }

              private void hideFullscreen() {
                  if (customView == null) return;

                  View decor = getWindow().getDecorView();

                  if (fullscreenContainer != null) {
                      ((ViewGroup) decor).removeView(fullscreenContainer);
                  }

                  customView = null;
                  fullscreenContainer = null;

                  getWindow().clearFlags(
                      WindowManager.LayoutParams.FLAG_KEEP_SCREEN_ON
                  );

                  decor.setSystemUiVisibility(oldSystemUiVisibility);

                  if (fullscreenCallback != null) {
                      WebChromeClient.CustomViewCallback callback =
                          fullscreenCallback;
                      fullscreenCallback = null;
                      callback.onCustomViewHidden();
                  }

                  restoreOrientation();
              }

              @Override
              protected void onSaveInstanceState(Bundle out) {
                  super.onSaveInstanceState(out);

                  if (webView != null) {
                      webView.saveState(out);
                  }
              }

              @Override
              public void onBackPressed() {
                  if (customView != null) {
                      hideFullscreen();
                  } else if (webView != null && webView.canGoBack()) {
                      webView.goBack();
                  } else {
                      super.onBackPressed();
                  }
              }

              @Override
              protected void onDestroy() {
                  if (customView != null) {
                      hideFullscreen();
                  }

                  restoreOrientation();

                  if (webView != null) {
                      webView.stopLoading();
                      webView.removeJavascriptInterface("ZysfxOrientation");
                      webView.destroy();
                      webView = null;
                  }

                  super.onDestroy();
              }
          }
          EOF

      - name: Verify generated files
        run: |
          test -s app/src/main/java/com/zysfx/app/MainActivity.java
          test -s app/src/main/AndroidManifest.xml
          test -s app/src/main/res/mipmap-hdpi/ic_launcher.png

      - name: Build APK
        run: gradle --no-daemon assembleDebug

      - name: Verify APK
        run: |
          APK="app/build/outputs/apk/debug/app-debug.apk"
          test -s "$APK"
          ls -lh "$APK"
          file "$APK"

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: zysfx-android-apk
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
