
name: Build ZYSFX Android APK

on:
  workflow_dispatch:
  push:
    paths:
      - ".github/workflows/build.yml"

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Setup Android SDK
        uses: android-actions/setup-android@v4

      - name: Install Android SDK packages
        run: sdkmanager "platforms;android-35" "build-tools;35.0.0"

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.9"

      - name: Generate Android project
        shell: bash
        run: |
          mkdir -p app/src/main/java/com/zysfx/app

          cat > settings.gradle <<'EOF'
          pluginManagement {
              repositories {
                  google()
                  mavenCentral()
                  gradlePluginPortal()
              }
          }
          dependencyResolutionManagement {
              repositoriesMode.set(RepositoriesMode.FAIL_ON_PROJECT_REPOS)
              repositories {
                  google()
                  mavenCentral()
              }
          }
          rootProject.name = "ZYSFX"
          include(":app")
          EOF

          cat > build.gradle <<'EOF'
          plugins {
              id 'com.android.application' version '8.7.3' apply false
          }
          EOF

          cat > app/build.gradle <<'EOF'
          plugins {
              id 'com.android.application'
          }

          android {
              namespace 'com.zysfx.app'
              compileSdk 35

              defaultConfig {
                  applicationId 'com.zysfx.app'
                  minSdk 23
                  targetSdk 35
                  versionCode 1
                  versionName '1.0.0'
              }
          }
          EOF

          cat > app/src/main/AndroidManifest.xml <<'EOF'
          <manifest xmlns:android="http://schemas.android.com/apk/res/android">
              <uses-permission android:name="android.permission.INTERNET"/>

              <application
                  android:label="资源社"
                  android:theme="@android:style/Theme.Material.Light.NoActionBar"
                  android:usesCleartextTraffic="false">

                  <activity
                      android:name=".MainActivity"
                      android:configChanges="orientation|screenSize|keyboardHidden"
                      android:exported="true">

                      <intent-filter>
                          <action android:name="android.intent.action.MAIN"/>
                          <category android:name="android.intent.category.LAUNCHER"/>
                      </intent-filter>
                  </activity>
              </application>
          </manifest>
          EOF

          cat > app/src/main/java/com/zysfx/app/MainActivity.java <<'EOF'
          package com.zysfx.app;

          import android.app.Activity;
          import android.os.Bundle;
          import android.graphics.Color;
          import android.view.View;
          import android.view.ViewGroup;
          import android.view.WindowManager;
          import android.webkit.WebChromeClient;
          import android.webkit.WebSettings;
          import android.webkit.WebView;
          import android.webkit.WebViewClient;
          import android.widget.FrameLayout;

          public class MainActivity extends Activity {
              private WebView webView;
              private View customView;
              private FrameLayout fullscreenContainer;
              private WebChromeClient.CustomViewCallback fullscreenCallback;
              private int oldSystemUiVisibility;

              @Override
              protected void onCreate(Bundle state) {
                  super.onCreate(state);

                  webView = new WebView(this);

                  WebSettings settings = webView.getSettings();
                  settings.setJavaScriptEnabled(true);
                  settings.setDomStorageEnabled(true);
                  settings.setMediaPlaybackRequiresUserGesture(false);

                  webView.setWebViewClient(new WebViewClient());

                  webView.setWebChromeClient(new WebChromeClient() {
                      @Override
                      public void onShowCustomView(
                              View view,
                              CustomViewCallback callback) {
                          if (customView != null) {
                              callback.onCustomViewHidden();
                              return;
                          }

                          customView = view;
                          fullscreenCallback = callback;

                          View decor = getWindow().getDecorView();
                          oldSystemUiVisibility =
                              decor.getSystemUiVisibility();

                          fullscreenContainer =
                              new FrameLayout(MainActivity.this);
                          fullscreenContainer.setBackgroundColor(Color.BLACK);

                          fullscreenContainer.addView(
                              view,
                              new FrameLayout.LayoutParams(
                                  ViewGroup.LayoutParams.MATCH_PARENT,
                                  ViewGroup.LayoutParams.MATCH_PARENT
                              )
                          );

                          ((ViewGroup) decor).addView(
                              fullscreenContainer,
                              new ViewGroup.LayoutParams(
                                  ViewGroup.LayoutParams.MATCH_PARENT,
                                  ViewGroup.LayoutParams.MATCH_PARENT
                              )
                          );

                          getWindow().addFlags(
                              WindowManager.LayoutParams.FLAG_KEEP_SCREEN_ON
                          );

                          decor.setSystemUiVisibility(
                              View.SYSTEM_UI_FLAG_FULLSCREEN
                              | View.SYSTEM_UI_FLAG_HIDE_NAVIGATION
                              | View.SYSTEM_UI_FLAG_IMMERSIVE_STICKY
                              | View.SYSTEM_UI_FLAG_LAYOUT_FULLSCREEN
                              | View.SYSTEM_UI_FLAG_LAYOUT_HIDE_NAVIGATION
                              | View.SYSTEM_UI_FLAG_LAYOUT_STABLE
                          );
                      }

                      @Override
                      public void onHideCustomView() {
                          exitFullscreen();
                      }
                  });

                  setContentView(webView);
                  webView.loadUrl("https://www.zysfx.com/");
              }

              private void exitFullscreen() {
                  if (customView == null) {
                      return;
                  }

                  View decor = getWindow().getDecorView();

                  if (fullscreenContainer != null) {
                      ((ViewGroup) decor).removeView(fullscreenContainer);
                  }

                  customView = null;
                  fullscreenContainer = null;

                  getWindow().clearFlags(
                      WindowManager.LayoutParams.FLAG_KEEP_SCREEN_ON
                  );

                  decor.setSystemUiVisibility(oldSystemUiVisibility);

                  WebChromeClient.CustomViewCallback callback =
                      fullscreenCallback;
                  fullscreenCallback = null;

                  if (callback != null) {
                      callback.onCustomViewHidden();
                  }
              }

              @Override
              public void onBackPressed() {
                  if (customView != null) {
                      exitFullscreen();
                  } else if (webView != null && webView.canGoBack()) {
                      webView.goBack();
                  } else {
                      super.onBackPressed();
                  }
              }

              @Override
              protected void onDestroy() {
                  if (customView != null) {
                      exitFullscreen();
                  }

                  if (webView != null) {
                      webView.destroy();
                      webView = null;
                  }

                  super.onDestroy();
              }
          }
          EOF

      - name: Build APK
        run: gradle assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: zysfx-android-apk
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
