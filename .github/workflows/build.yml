
name: Build ZYSFX Android APK

on:
  workflow_dispatch:
  push:
    paths:
      - ".github/workflows/build.yml"

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Java
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"

      - name: Setup Android SDK
        uses: android-actions/setup-android@v4

      - name: Install Android SDK packages
        run: sdkmanager "platforms;android-35" "build-tools;35.0.0"

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.9"

      - name: Generate Android project
        shell: bash
        run: |
          mkdir -p app/src/main/java/com/zysfx/app

          cat > settings.gradle <<'EOF'
          pluginManagement {
              repositories {
                  google()
                  mavenCentral()
                  gradlePluginPortal()
              }
          }
          dependencyResolutionManagement {
              repositoriesMode.set(RepositoriesMode.FAIL_ON_PROJECT_REPOS)
              repositories {
                  google()
                  mavenCentral()
              }
          }
          rootProject.name = "ZYSFX"
          include(":app")
          EOF

          cat > build.gradle <<'EOF'
          plugins {
              id 'com.android.application' version '8.7.3' apply false
          }
          EOF

          cat > app/build.gradle <<'EOF'
          plugins {
              id 'com.android.application'
          }

          android {
              namespace 'com.zysfx.app'
              compileSdk 35

              defaultConfig {
                  applicationId 'com.zysfx.app'
                  minSdk 23
                  targetSdk 35
                  versionCode 3
                  versionName '1.2.0'
              }
          }
          EOF

          cat > app/src/main/AndroidManifest.xml <<'EOF'
          <manifest xmlns:android="http://schemas.android.com/apk/res/android">
              <uses-permission android:name="android.permission.INTERNET"/>

              <application
                  android:label="资源社"
                  android:theme="@android:style/Theme.Material.Light.NoActionBar"
                  android:usesCleartextTraffic="false">

                  <activity
                      android:name=".MainActivity"
                      android:exported="true"
                      android:configChanges="orientation|screenSize|keyboardHidden">

                      <intent-filter>
                          <action android:name="android.intent.action.MAIN"/>
                          <category android:name="android.intent.category.LAUNCHER"/>
                      </intent-filter>
                  </activity>
              </application>
          </manifest>
          EOF

          cat > app/src/main/java/com/zysfx/app/MainActivity.java <<'EOF'
          package com.zysfx.app;

          import android.app.Activity;
          import android.content.pm.ActivityInfo;
          import android.os.Bundle;
          import android.graphics.Color;
          import android.view.View;
          import android.view.ViewGroup;
          import android.view.WindowManager;
          import android.webkit.JavascriptInterface;
          import android.webkit.WebChromeClient;
          import android.webkit.WebSettings;
          import android.webkit.WebView;
          import android.webkit.WebViewClient;
          import android.widget.FrameLayout;

          public class MainActivity extends Activity {

              private WebView webView;
              private View customView;
              private FrameLayout fullscreenContainer;
              private WebChromeClient.CustomViewCallback fullscreenCallback;

              private int oldSystemUiVisibility;
              private int oldRequestedOrientation =
                      ActivityInfo.SCREEN_ORIENTATION_UNSPECIFIED;

              private boolean orientationChanged = false;
              private boolean lastMediaLandscape = false;

              private void enterOrientation(int orientation) {
                  if (!orientationChanged) {
                      oldRequestedOrientation = getRequestedOrientation();
                      orientationChanged = true;
                  }
                  setRequestedOrientation(orientation);
              }

              private void restoreOrientation() {
                  if (orientationChanged) {
                      setRequestedOrientation(oldRequestedOrientation);
                      orientationChanged = false;
                  }
              }

              private class OrientationBridge {

                  @JavascriptInterface
                  public void setContentOrientation(final int mode) {
                      runOnUiThread(() -> {
                          if (customView != null) return;

                          if (mode == 1) {
                              enterOrientation(
                                  ActivityInfo.SCREEN_ORIENTATION_SENSOR_LANDSCAPE
                              );
                          } else if (mode == 0) {
                              enterOrientation(
                                  ActivityInfo.SCREEN_ORIENTATION_PORTRAIT
                              );
                          }
                      });
                  }

                  @JavascriptInterface
                  public void restoreContentOrientation() {
                      runOnUiThread(() -> {
                          if (customView == null) {
                              restoreOrientation();
                          }
                      });
                  }

                  @JavascriptInterface
                  public void setMediaDimensions(
                          final int width,
                          final int height) {
                      if (width > 0 && height > 0) {
                          lastMediaLandscape = width > height;
                      }
                  }
              }

              @Override
              protected void onCreate(Bundle state) {
                  super.onCreate(state);

                  webView = new WebView(this);

                  webView.setLayoutParams(new ViewGroup.LayoutParams(
                      ViewGroup.LayoutParams.MATCH_PARENT,
                      ViewGroup.LayoutParams.MATCH_PARENT
                  ));

                  WebSettings settings = webView.getSettings();
                  settings.setJavaScriptEnabled(true);
                  settings.setDomStorageEnabled(true);
                  settings.setMediaPlaybackRequiresUserGesture(false);
                  settings.setLoadWithOverviewMode(true);
                  settings.setUseWideViewPort(true);

                  webView.addJavascriptInterface(
                      new OrientationBridge(),
                      "ZysfxOrientation"
                  );

                  webView.setWebViewClient(new WebViewClient() {
                      @Override
                      public void onPageFinished(WebView view, String url) {
                          super.onPageFinished(view, url);
                          injectOrientationDetector(view);
                      }
                  });

                  webView.setWebChromeClient(new WebChromeClient() {

                      @Override
                      public void onShowCustomView(
                              View view,
                              CustomViewCallback callback) {

                          if (customView != null) {
                              callback.onCustomViewHidden();
                              return;
                          }

                          customView = view;
                          fullscreenCallback = callback;

                          oldRequestedOrientation =
                                  getRequestedOrientation();
                          orientationChanged = true;

                          oldSystemUiVisibility =
                                  getWindow().getDecorView()
                                      .getSystemUiVisibility();

                          fullscreenContainer =
                                  new FrameLayout(MainActivity.this);
                          fullscreenContainer.setBackgroundColor(Color.BLACK);

                          fullscreenContainer.addView(
                              view,
                              new FrameLayout.LayoutParams(
                                  ViewGroup.LayoutParams.MATCH_PARENT,
                                  ViewGroup.LayoutParams.MATCH_PARENT
                              )
                          );

                          View decor = getWindow().getDecorView();

                          ((ViewGroup) decor).addView(
                              fullscreenContainer,
                              new ViewGroup.LayoutParams(
                                  ViewGroup.LayoutParams.MATCH_PARENT,
                                  ViewGroup.LayoutParams.MATCH_PARENT
                              )
                          );

                          getWindow().addFlags(
                              WindowManager.LayoutParams.FLAG_KEEP_SCREEN_ON
                          );

                          // 根据视频实际宽高选择方向
                          if (lastMediaLandscape) {
                              setRequestedOrientation(
                                  ActivityInfo.SCREEN_ORIENTATION_SENSOR_LANDSCAPE
                              );
                          } else {
                              setRequestedOrientation(
                                  ActivityInfo.SCREEN_ORIENTATION_PORTRAIT
                              );
                          }

                          decor.setSystemUiVisibility(
                              View.SYSTEM_UI_FLAG_FULLSCREEN
                              | View.SYSTEM_UI_FLAG_HIDE_NAVIGATION
                              | View.SYSTEM_UI_FLAG_IMMERSIVE_STICKY
                              | View.SYSTEM_UI_FLAG_LAYOUT_FULLSCREEN
                              | View.SYSTEM_UI_FLAG_LAYOUT_HIDE_NAVIGATION
                              | View.SYSTEM_UI_FLAG_LAYOUT_STABLE
                          );
                      }

                      @Override
                      public void onHideCustomView() {
                          hideFullscreen();
                      }
                  });

                  setContentView(webView);

                  if (state == null) {
                      webView.loadUrl("https://www.zysfx.com/");
                  } else {
                      webView.restoreState(state);
                  }
              }

              private void injectOrientationDetector(WebView view) {
                  String js =
                      "(function(){"
                    + "if(window.__zysfxOrientationInstalled)return;"
                    + "window.__zysfxOrientationInstalled=true;"
                    + "var timer=null;"
                    + "function visible(el){"
                    + "if(!el)return false;"
                    + "var r=el.getBoundingClientRect();"
                    + "var s=getComputedStyle(el);"
                    + "return r.width>0&&r.height>0&&"
                    + "s.display!=='none'&&s.visibility!=='hidden';"
                    + "}"
                    + "function mediaIn(root){"
                    + "if(!root)return null;"
                    + "if(root.matches&&root.matches('img,video'))return root;"
                    + "return root.querySelector('video,img');"
                    + "}"
                    + "function detect(){"
                    + "var root=document.fullscreenElement;"
                    + "var media=mediaIn(root);"
                    + "if(!media){"
                    + "var selectors="
                    + "'[class*=lightbox],[id*=lightbox],'"
                    + "+'[class*=fullscreen],[id*=fullscreen],'"
                    + "+'[class*=fancybox],[class*=pswp],'"
                    + "+'[class*=photo-view],[class*=image-view]';"
                    + "var nodes=document.querySelectorAll(selectors);"
                    + "var bestArea=0;"
                    + "for(var i=0;i<nodes.length;i++){"
                    + "var node=nodes[i];"
                    + "if(!visible(node))continue;"
                    + "var r=node.getBoundingClientRect();"
                    + "if(r.width<innerWidth*.55||"
                    + "r.height<innerHeight*.40)continue;"
                    + "var m=mediaIn(node);"
                    + "if(!m||!visible(m))continue;"
                    + "var mr=m.getBoundingClientRect();"
                    + "var area=mr.width*mr.height;"
                    + "if(area>bestArea){bestArea=area;media=m;}"
                    + "}"
                    + "}"
                    + "if(media&&visible(media)){"
                    + "var w=media.tagName==='VIDEO'?"
                    + "(media.videoWidth||media.clientWidth):"
                    + "(media.naturalWidth||media.clientWidth);"
                    + "var h=media.tagName==='VIDEO'?"
                    + "(media.videoHeight||media.clientHeight):"
                    + "(media.naturalHeight||media.clientHeight);"
                    + "if(w>0&&h>0){"
                    + "ZysfxOrientation.setMediaDimensions(w,h);"
                    + "ZysfxOrientation.setContentOrientation(w>h?1:0);"
                    + "return;"
                    + "}"
                    + "}"
                    + "if(!document.fullscreenElement){"
                    + "ZysfxOrientation.restoreContentOrientation();"
                    + "}"
                    + "}"
                    + "document.addEventListener('fullscreenchange',detect);"
                    + "document.addEventListener('webkitfullscreenchange',detect);"
                    + "document.addEventListener('click',function(){"
                    + "setTimeout(detect,300);"
                    + "setTimeout(detect,800);"
                    + "},true);"
                    + "document.addEventListener('loadedmetadata',function(e){"
                    + "var v=e.target;"
                    + "if(v&&v.tagName==='VIDEO'){"
                    + "ZysfxOrientation.setMediaDimensions("
                    + "v.videoWidth,v.videoHeight);"
                    + "}"
                    + "},true);"
                    + "new MutationObserver(function(){"
                    + "if(timer)clearTimeout(timer);"
                    + "timer=setTimeout(detect,200);"
                    + "}).observe(document.documentElement,{"
                    + "childList:true,subtree:true,attributes:true,"
                    + "attributeFilter:['class','style']});"
                    + "})();";

                  view.evaluateJavascript(js, null);
              }

              private void hideFullscreen() {
                  if (customView == null) return;

                  View decor = getWindow().getDecorView();

                  if (fullscreenContainer != null) {
                      ((ViewGroup) decor).removeView(fullscreenContainer);
                  }

                  customView = null;
                  fullscreenContainer = null;

                  getWindow().clearFlags(
                      WindowManager.LayoutParams.FLAG_KEEP_SCREEN_ON
                  );

                  decor.setSystemUiVisibility(oldSystemUiVisibility);
                  restoreOrientation();

                  if (fullscreenCallback != null) {
                      WebChromeClient.CustomViewCallback callback =
                              fullscreenCallback;
                      fullscreenCallback = null;
                      callback.onCustomViewHidden();
                  }
              }

              @Override
              protected void onSaveInstanceState(Bundle out) {
                  super.onSaveInstanceState(out);
                  if (webView != null) {
                      webView.saveState(out);
                  }
              }

              @Override
              public void onBackPressed() {
                  if (customView != null) {
                      hideFullscreen();
                  } else if (webView != null && webView.canGoBack()) {
                      webView.goBack();
                  } else {
                      super.onBackPressed();
                  }
              }

              @Override
              protected void onDestroy() {
                  if (customView != null) {
                      hideFullscreen();
                  }

                  restoreOrientation();

                  if (webView != null) {
                      webView.stopLoading();
                      webView.removeJavascriptInterface("ZysfxOrientation");
                      webView.destroy();
                      webView = null;
                  }

                  super.onDestroy();
              }
          }
          EOF

      - name: Build APK
        run: gradle assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: zysfx-android-apk
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
